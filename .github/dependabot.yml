# Weekly update PRs against main, grouped so each ecosystem is one PR.
version: 2
updates:
  - package-ecosystem: github-actions
    directory: /
    schedule:
      interval: weekly
    groups:
      actions:
        patterns: ["*"]
  - package-ecosystem: cargo
    directory: /
    schedule:
      interval: weekly
    groups:
      crates:
        patterns: ["*"]
    # windows and windows-core move together, and each 0.x minor breaks the API: a deliberate
    # migration, not a weekly bump.
    ignore:
      - dependency-name: "windows*"
        update-types: ["version-update:semver-minor", "version-update:semver-major"]
