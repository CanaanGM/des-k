# Lints and tests every push. A pushed tag like v0.1.0 also builds the release exe and
# creates a draft GitHub Release with the setup exe (des-k.iss), a zip (des-k.exe, install.ps1,
# README.md, LICENSE) and their checksums. It goes public only through sign-release.ps1 on the
# publisher's PC (RELEASING.md, spec 0031), and des-k refuses a release that skipped it.
# Actions are pinned to full commit SHAs so a moved tag cannot change what builds the release.
name: build

on:
  push:
    branches: [main]
    tags: ['v*']
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  test:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: dtolnay/rust-toolchain@39008827e6b4319a349e9a42dfc90579dd25f1ca # stable
        with:
          toolchain: stable
          components: clippy
      - uses: Swatinem/rust-cache@d1527c8f67ef9af357290475d4af4b0fab8f12e0 # v2.9.3
      - run: cargo clippy --all-targets --locked -- -D warnings
      - run: cargo test --locked

  release:
    needs: test
    if: startsWith(github.ref, 'refs/tags/v')
    runs-on: windows-latest
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: dtolnay/rust-toolchain@39008827e6b4319a349e9a42dfc90579dd25f1ca # stable
        with:
          toolchain: stable
      - uses: Swatinem/rust-cache@d1527c8f67ef9af357290475d4af4b0fab8f12e0 # v2.9.3
      - name: Tag matches Cargo.toml
        shell: pwsh
        run: |
          $version = (Select-String -Path Cargo.toml -Pattern '^version = "(.+)"').Matches[0].Groups[1].Value
          if ("v$version" -ne '${{ github.ref_name }}') { throw "tag ${{ github.ref_name }} but Cargo.toml says $version" }
      - run: cargo build --release
      - name: Package
        shell: pwsh
        run: |
          $tag = '${{ github.ref_name }}'
          $dir = "des-k-$tag"
          New-Item -ItemType Directory $dir, dist | Out-Null
          Copy-Item target/release/des-k.exe, install.ps1, README.md, LICENSE $dir
          Compress-Archive $dir "dist/des-k-$tag-windows-x64.zip"
          choco install innosetup --version 6.7.1 -y --no-progress
          & "${env:ProgramFiles(x86)}\Inno Setup 6\ISCC.exe" /Q "/DAppVersion=$($tag.TrimStart('v'))" des-k.iss
          if ($LASTEXITCODE) { throw 'installer build failed' }
          Copy-Item "target/setup/des-k-$tag-setup.exe" dist
          Get-FileHash dist/* -Algorithm SHA256 | ForEach-Object { "$($_.Hash.ToLower())  $(Split-Path $_.Path -Leaf)" } | Set-Content dist/SHA256SUMS.txt
      - name: Draft the release
        shell: pwsh
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          $tag = '${{ github.ref_name }}'
          $notes = @"
          Download ``des-k-$tag-setup.exe``, run it, and say Yes to the admin prompt. Uninstall it
          from Settings, Apps. The zip holds the same des-k.exe with install.ps1, for those who
          prefer a script. The guide: https://canaangm.github.io/des-k/

          ``SHA256SUMS.txt.minisig`` is the publisher's signature over the checksums in
          ``SHA256SUMS.txt``. The README shows how to check both:
          https://github.com/CanaanGM/des-k#check-a-download
          "@
          gh release create $tag (Get-ChildItem dist).FullName --title "des-k $tag" --notes $notes --generate-notes --draft
