# Lints and tests every push. A pushed tag like v0.1.0 also builds the release exe and
# publishes a GitHub Release with the setup exe (des-k.iss), a zip (des-k.exe, install.ps1,
# README.md, LICENSE) and their checksums.
name: build

on:
  push:
    branches: [main]
    tags: ['v*']
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  test:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v5
      - uses: dtolnay/rust-toolchain@stable
        with:
          components: clippy
      - uses: Swatinem/rust-cache@v2
      - run: cargo clippy --all-targets
      - run: cargo test

  release:
    needs: test
    if: startsWith(github.ref, 'refs/tags/v')
    runs-on: windows-latest
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v5
      - uses: dtolnay/rust-toolchain@stable
      - uses: Swatinem/rust-cache@v2
      - name: Tag matches Cargo.toml
        shell: pwsh
        run: |
          $version = (Select-String -Path Cargo.toml -Pattern '^version = "(.+)"').Matches[0].Groups[1].Value
          if ("v$version" -ne '${{ github.ref_name }}') { throw "tag ${{ github.ref_name }} but Cargo.toml says $version" }
      - run: cargo build --release
      - name: Package
        shell: pwsh
        run: |
          $tag = '${{ github.ref_name }}'
          $dir = "des-k-$tag"
          New-Item -ItemType Directory $dir, dist | Out-Null
          Copy-Item target/release/des-k.exe, install.ps1, README.md, LICENSE $dir
          Compress-Archive $dir "dist/des-k-$tag-windows-x64.zip"
          choco install innosetup -y --no-progress
          & "${env:ProgramFiles(x86)}\Inno Setup 6\ISCC.exe" /Q "/DAppVersion=$($tag.TrimStart('v'))" des-k.iss
          if ($LASTEXITCODE) { throw 'installer build failed' }
          Copy-Item "target/setup/des-k-$tag-setup.exe" dist
          Get-FileHash dist/* -Algorithm SHA256 | ForEach-Object { "$($_.Hash.ToLower())  $(Split-Path $_.Path -Leaf)" } | Set-Content dist/SHA256SUMS.txt
      - name: Publish the release
        shell: pwsh
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          $tag = '${{ github.ref_name }}'
          $notes = @"
          Download ``des-k-$tag-setup.exe``, run it, and say Yes to the admin prompt. Uninstall it
          from Settings, Apps. The zip holds the same des-k.exe with install.ps1, for those who
          prefer a script. The guide: https://canaangm.github.io/des-k/
          "@
          gh release create $tag (Get-ChildItem dist).FullName --title "des-k $tag" --notes $notes --generate-notes
